            @override
            Widget build(BuildContext context) {
              final dict = ref.watch(dictionaryProvider);
              final tts = ref.watch(ttsServiceProvider);
              final w = dict[_idx % dict.length];

              return Padding(
                padding: const EdgeInsets.all(20),
                child: Column(
                  children: [
                    const Text('🧠 نظام التكرار المتباعد الذكي (SRS)', style: TextStyle(fontWeight: FontWeight.bold, fontSize: 18)),
                    const SizedBox(height: 20),
                    Expanded(
                      child: GestureDetector(
                        onTap: () => setState(() => _flipped = !_flipped),
                        child: Card(
                          elevation: 6,
                          shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(24)),
                          child: Center(
                            child: Padding(
                              padding: const EdgeInsets.all(24),
                              child: Column(
                                mainAxisSize: MainAxisSize.min,
                                children: [
                                  IconButton(icon: const Icon(Icons.volume_up, size: 44, color: Color(0xFF3B82F6)), onPressed: () => tts.speak(w.word)),
                                  const SizedBox(height: 10),
                                  Text(_flipped ? w.translation : w.word, style: TextStyle(fontSize: 32, fontWeight: FontWeight.bold, color: _flipped ? Colors.green : null)),
                                  const SizedBox(height: 8),
                                  Text(_flipped ? w.exampleTranslation : w.phonetic, style: const TextStyle(fontSize: 16, color: Colors.grey)),
                                  const SizedBox(height: 20),
                                  Text(_flipped ? 'مثال: ${w.exampleSentence}' : 'اضغط لقلب البطاقة ومعرفة المعنى', style: const TextStyle(fontStyle: FontStyle.italic, color: Colors.grey)),
                                ],
                              ),
                            ),
                          ),
                        ),
                      ),
                    ),
                    const SizedBox(height: 20),
                    Row(
                      mainAxisAlignment: MainAxisAlignment.spaceEvenly,
                      children: [
                        ElevatedButton(style: ElevatedButton.styleFrom(backgroundColor: Colors.red.shade400, foregroundColor: Colors.white), onPressed: () => _rate(5), child: const Text('صعبة (Hard)')),
                        ElevatedButton(style: ElevatedButton.styleFrom(backgroundColor: Colors.blue.shade400, foregroundColor: Colors.white), onPressed: () => _rate(10), child: const Text('جيدة (Good)')),
                        ElevatedButton(style: ElevatedButton.styleFrom(backgroundColor: Colors.green.shade500, foregroundColor: Colors.white), onPressed: () => _rate(15), child: const Text('سهلة (Easy)')),
                      ],
                    ),
                    const SizedBox(height: 16),
                  ],
                ),
              );
            }

            void _rate(int xp) {
              ref.read(userProfileProvider.notifier).addXp(xp);
              setState(() {
                _flipped = false;
                _idx++;
              });
            }
          }

          // =========================================
          // 10. TAB 3: DIALOGUES & ROLEPLAY
          // =========================================

          class DialoguesTab extends ConsumerWidget {
            const DialoguesTab({super.key});

            @override
            Widget build(BuildContext context, WidgetRef ref) {
              final tts = ref.watch(ttsServiceProvider);
              final script = [
                DialogueTurn(speaker: 'Receptionist', text: 'Good evening! Welcome to the Grand Hotel. How can I help you?', translation: 'مساء الخير! مرحباً بكم في فندق جراند. كيف أساعدك؟'),
                DialogueTurn(speaker: 'You', text: 'Hello! I have a room reservation under the name Ahmed.', translation: 'مرحباً! لدي حجز غرفة باسم أحمد.'),
                DialogueTurn(speaker: 'Receptionist', text: 'Perfect! Here is your room key on the 5th floor. Enjoy your stay!', translation: 'ممتاز! هذا مفتاح غرفتك في الطابق الخامس. إقامة ممتعة!'),
                DialogueTurn(speaker: 'You', text: 'Thank you very much. What time is breakfast served?', translation: 'شكراً جزيلاً. في أي وقت يُقدم الإفطار؟'),
                DialogueTurn(speaker: 'Receptionist', text: 'Breakfast is from 7:00 AM to 10:30 AM in the main dining hall.', translation: 'الإفطار من الساعة 7:00 صباحاً حتى 10:30 صباحاً في القاعة الرئيسية.'),
              ];

              return Scaffold(
                appBar: AppBar(title: const Text('🎭 محادثة تفاعلية: حجز فندق')),
                body: ListView.builder(
                  padding: const EdgeInsets.all(16),
                  itemCount: script.length,
                  itemBuilder: (ctx, i) {
                    final t = script[i];
                    final isUser = t.speaker == 'You';
                    return Align(
                      alignment: isUser ? Alignment.centerRight : Alignment.centerLeft,
                      child: Container(
                        margin: const EdgeInsets.symmetric(vertical: 8),
                        padding: const EdgeInsets.all(14),
                        constraints: BoxConstraints(maxWidth: MediaQuery.of(context).size.width * 0.82),
                        decoration: BoxDecoration(
                          color: isUser ? const Color(0xFF2563EB) : (Theme.of(context).brightness == Brightness.dark ? const Color(0xFF1E1E1E) : Colors.grey.shade200),
                          borderRadius: BorderRadius.circular(16),
                        ),
                        child: Column(
                          crossAxisAlignment: isUser ? CrossAxisAlignment.end : CrossAxisAlignment.start,
                          children: [
                            Text(t.speaker, style: TextStyle(fontWeight: FontWeight.bold, color: isUser ? Colors.white70 : const Color(0xFF3B82F6))),
                            const SizedBox(height: 4),
                            Text(t.text, style: TextStyle(fontSize: 16, fontWeight: FontWeight.w600, color: isUser ? Colors.white : null)),
                            const SizedBox(height: 2),
                            Text(t.translation, style: TextStyle(fontSize: 13, color: isUser ? Colors.white60 : Colors.grey.shade600)),
                            IconButton(
                              icon: Icon(Icons.volume_up, size: 20, color: isUser ? Colors.white : const Color(0xFF3B82F6)),
                              onPressed: () => tts.speak(t.text),
                            )
                          ],
                        ),
                      ),
                    );
                  },
                ),
              );
            }
          }

          // =========================================
          // 11. TAB 4: PODCASTS STUDIO
          // =========================================

          class PodcastsTab extends ConsumerWidget {
            const PodcastsTab({super.key});

            @override
            Widget build(BuildContext context, WidgetRef ref) {
              final tts = ref.watch(ttsServiceProvider);
              final episodes = [
                PodcastEpisode(id: 'p1', title: 'Episode 1: The Fast Way to Fluency', description: 'أسرار واستراتيجيات التحدث بطلاقة يومياً', cefrLevel: 'A2', audioPath: '', durationSeconds: 180, transcript: [
                  TranscriptSegment(text: 'Welcome to PolyglotMaster podcast.', startMs: 0, endMs: 2000),
                  TranscriptSegment(text: 'To speak fluent English, practice 15 minutes every single day.', startMs: 2000, endMs: 5000),
                  TranscriptSegment(text: 'Listen actively, repeat out loud, and don’t fear making mistakes!', startMs: 5000, endMs: 9000),
                ]),
                PodcastEpisode(id: 'p2', title: 'Episode 2: Mastering British & American Accents', description: 'الفروق الجوهرية في النطق بين اللهجتين', cefrLevel: 'B1', audioPath: '', durationSeconds: 240, transcript: [
                  TranscriptSegment(text: 'Accent is music. Focus on vowels and rhythm.', startMs: 0, endMs: 3000),
                ]),
              ];

              return ListView.builder(
                padding: const EdgeInsets.all(16),
                itemCount: episodes.length,
                itemBuilder: (ctx, i) {
                  final p = episodes[i];
                  return Card(
                    margin: const EdgeInsets.only(bottom: 16),
                    shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(20)),
                    child: Padding(
                      padding: const EdgeInsets.all(16),
                      child: Column(
                        crossAxisAlignment: CrossAxisAlignment.start,
                        children: [
                          Row(
                            children: [
                              CircleAvatar(backgroundColor: const Color(0xFF2563EB).withOpacity(0.2), child: const Icon(Icons.podcasts, color: Color(0xFF2563EB))),
                              const SizedBox(width: 12),
                              Expanded(
                                child: Column(
                                  crossAxisAlignment: CrossAxisAlignment.start,
                                  children: [
                                    Text(p.title, style: const TextStyle(fontWeight: FontWeight.bold, fontSize: 16)),
                                    Text('Level ${p.cefrLevel} • ${p.description}', style: const TextStyle(color: Colors.grey, fontSize: 13)),
                                  ],
                                ),
                              )
                            ],
                          ),
                          const Divider(height: 24),
                          ...p.transcript.map((s) => Padding(
                                padding: const EdgeInsets.symmetric(vertical: 4),
                                child: Text('🎙️ ${s.text}', style: const TextStyle(fontSize: 15, height: 1.4)),
                              )),
                          const SizedBox(height: 12),
                          Center(
                            child: ElevatedButton.icon(
                              icon: const Icon(Icons.play_arrow),
