          class ProfileTab extends ConsumerWidget {
            const ProfileTab({super.key});

            @override
            Widget build(BuildContext context, WidgetRef ref) {
              final profile = ref.watch(userProfileProvider);
              final tts = ref.watch(ttsServiceProvider);

              return SingleChildScrollView(
                padding: const EdgeInsets.all(20),
                child: Column(
                  children: [
                    CircleAvatar(
                      radius: 45,
                      backgroundColor: const Color(0xFF2563EB),
                      child: Text(profile.fullName.isNotEmpty ? profile.fullName[0].toUpperCase() : 'P', style: const TextStyle(fontSize: 38, fontWeight: FontWeight.bold, color: Colors.white)),
                    ),
                    const SizedBox(height: 12),
                    Text(profile.fullName, style: const TextStyle(fontSize: 24, fontWeight: FontWeight.bold)),
                    Text('العمر: ${profile.age} سنة • المستوى: ${profile.cefrLevel}', style: const TextStyle(color: Colors.grey, fontSize: 16)),
                    const SizedBox(height: 20),
                    Row(
                      mainAxisAlignment: MainAxisAlignment.spaceEvenly,
                      children: [
                        _card('إجمالي النقاط', '${profile.totalXp} XP', Icons.stars, Colors.amber),
                        _card('أيام الحماس', '${profile.streakDays} أيام', Icons.local_fire_department, Colors.orange),
                        _card('القلوب', '${profile.hearts} / 5', Icons.favorite, Colors.red),
                      ],
                    ),
                    const SizedBox(height: 24),
                    Card(
                      child: Column(
                        children: [
                          ListTile(
                            leading: const Icon(Icons.speed, color: Color(0xFF3B82F6)),
                            title: const Text('سرعة النطق الصوتي (Speech Rate)'),
                            trailing: DropdownButton<double>(
                              value: 0.48,
                              items: [0.35, 0.48, 0.60].map((r) => DropdownMenuItem(value: r, child: Text('${r}x'))).toList(),
                              onChanged: (v) => tts.setSpeechRate(v!),
                            ),
                          ),
                          const Divider(height: 1),
                          SwitchListTile(
                            secondary: const Icon(Icons.brightness_4),
                            title: const Text('الوضع المظلم (AMOLED Pure Black)'),
                            value: Theme.of(context).brightness == Brightness.dark,
                            onChanged: (_) => ref.read(themeModeProvider.notifier).toggleTheme(),
                          ),
                        ],
                      ),
                    ),
                    const SizedBox(height: 20),
                    const Text('PolyglotMaster English v1.0.1 • 100% Offline Platform', style: TextStyle(color: Colors.grey, fontSize: 12)),
                  ],
                ),
              );
            }

            Widget _card(String title, String val, IconData icon, Color c) {
              return Card(
                elevation: 2,
                shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(16)),
                child: Padding(
                  padding: const EdgeInsets.symmetric(horizontal: 16, vertical: 14),
                  child: Column(
                    children: [
                      Icon(icon, color: c, size: 28),
                      const SizedBox(height: 6),
                      Text(val, style: const TextStyle(fontWeight: FontWeight.bold, fontSize: 16)),
                      Text(title, style: const TextStyle(color: Colors.grey, fontSize: 12)),
                    ],
                  ),
                ),
              );
            }
          }
