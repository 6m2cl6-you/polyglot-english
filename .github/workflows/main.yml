          class LessonQuizScreen extends ConsumerStatefulWidget {
            final Lesson lesson;
            const LessonQuizScreen({super.key, required this.lesson});

            @override
            ConsumerState<LessonQuizScreen> createState() => _LessonQuizScreenState();
          }

          class _LessonQuizScreenState extends ConsumerState<LessonQuizScreen> {
            int _idx = 0;
            int _score = 0;
            int _xpEarned = 0;

            @override
            Widget build(BuildContext context) {
              final ex = widget.lesson.exercises[_idx];
              final tts = ref.watch(ttsServiceProvider);

              return Scaffold(
                appBar: AppBar(title: Text(widget.lesson.title)),
                body: Padding(
                  padding: const EdgeInsets.all(20),
                  child: Column(
                    crossAxisAlignment: CrossAxisAlignment.stretch,
                    children: [
                      LinearProgressIndicator(value: (_idx + 1) / widget.lesson.exercises.length),
                      const SizedBox(height: 24),
                      Text('سؤال ${_idx + 1} من ${widget.lesson.exercises.length}:', style: const TextStyle(color: Colors.grey, fontSize: 16)),
                      const SizedBox(height: 8),
                      Text(ex.question, style: const TextStyle(fontSize: 22, fontWeight: FontWeight.bold)),
                      const SizedBox(height: 12),
                      IconButton(
                        alignment: Alignment.centerLeft,
                        icon: const Icon(Icons.volume_up, size: 36, color: Color(0xFF3B82F6)),
                        onPressed: () => tts.speak(ex.question),
                      ),
                      const SizedBox(height: 20),
                      ...ex.options.map((opt) => Padding(
                            padding: const EdgeInsets.only(bottom: 12),
                            child: ElevatedButton(
                              style: ElevatedButton.styleFrom(padding: const EdgeInsets.all(16), shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(12))),
                              onPressed: () => _handleAnswer(opt, ex),
                              child: Text(opt, style: const TextStyle(fontSize: 16)),
                            ),
                          )),
                    ],
                  ),
                ),
              );
            }

            void _handleAnswer(String opt, Exercise ex) {
              final isCorrect = opt == ex.correctAnswer;
              if (isCorrect) {
                _score++;
                _xpEarned += ex.xpReward;
                ref.read(userProfileProvider.notifier).addXp(ex.xpReward);
                ref.read(userProfileProvider.notifier).updateStreak();
              } else {
                ref.read(userProfileProvider.notifier).loseHeart();
              }

              showDialog(
                context: context,
                barrierDismissible: false,
                builder: (_) => AlertDialog(
                  title: Text(isCorrect ? '✅ إجابة صحيحة!' : '❌ إجابة غير صحيحة!'),
                  content: Text('${ex.explanation}\n\n${isCorrect ? "+${ex.xpReward} XP ⭐" : "فقدت قلباً واحداً ❤️"}'),
                  actions: [
                    TextButton(
                      onPressed: () {
                        Navigator.pop(context);
                        if (_idx < widget.lesson.exercises.length - 1) {
                          setState(() => _idx++);
                        } else {
                          Navigator.pop(context);
                          ScaffoldMessenger.of(context).showSnackBar(SnackBar(backgroundColor: Colors.green, content: Text('🎉 أكملت الدرس بنجاح وحصلت على $_xpEarned XP!')));
                        }
                      },
                      child: const Text('متابعة ➜'),
                    )
                  ],
                ),
              );
            }
          }

