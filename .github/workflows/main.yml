name: Build Android Release APK v1.0.1

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Set up Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Create Complete Flutter Production App
        run: |
          flutter create polyglot_master --platforms=android --org com.polyglotmaster.app
          cd polyglot_master

          # 1. Setup Dependencies
          cat << 'EOF' > pubspec.yaml
          name: polyglot_master
          description: "PolyglotMaster English - 100% Offline Learning Platform"
          publish_to: 'none'
          version: 1.0.1+2

          environment:
            sdk: '>=3.0.0 <4.0.0'

          dependencies:
            flutter:
              sdk: flutter
            flutter_riverpod: ^2.5.1
            shared_preferences: ^2.2.3
            flutter_tts: ^4.0.2
            just_audio: ^0.9.37
            audio_video_progress_bar: ^0.11.0
            google_fonts: ^6.2.1
            url_launcher: ^6.2.6

          flutter:
            uses-material-design: true
            assets:
              - assets/audio/podcasts/
          EOF

          # 2. Adjust Android Configuration
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/g' android/app/build.gradle || true
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 21/g' android/app/build.gradle || true

          # 3. Create Placeholder Assets
          mkdir -p assets/audio/podcasts
          touch assets/audio/podcasts/london.mp3
          touch assets/audio/podcasts/business.mp3

          # 4. Inject Full Robust Application Code
          cat << 'EOF' > lib/main.dart
          import 'dart:convert';
          import 'dart:math';
          import 'package:flutter/material.dart';
          import 'package:flutter_riverpod/flutter_riverpod.dart';
          import 'package:shared_preferences/shared_preferences.dart';
          import 'package:google_fonts/google_fonts.dart';
          import 'package:flutter_tts/flutter_tts.dart';
          import 'package:just_audio/just_audio.dart';
          import 'package:audio_video_progress_bar/audio_video_progress_bar.dart';
          import 'package:url_launcher/url_launcher.dart';

          // =========================================
          // 1. DATA MODELS
          // =========================================

          class UserProfile {
            final String fullName;
            final int age;
            final String cefrLevel;
            final int dailyGoalMinutes;
            final int totalXp;
            final int streakDays;
            final int hearts;
            final int maxHearts;
            final DateTime? lastActivityDate;
            final Map<String, int> skillScores;
            final List<String> unlockedAchievements;
            final List<String> favoriteWords;
            final Map<String, int> lessonProgress;
            final Map<String, String> srsData;

            UserProfile({
              required this.fullName,
              required this.age,
              required this.cefrLevel,
              required this.dailyGoalMinutes,
              this.totalXp = 0,
              this.streakDays = 0,
              this.hearts = 5,
              this.maxHearts = 5,
              this.lastActivityDate,
              this.skillScores = const {
                'reading': 0,
                'listening': 0,
                'vocabulary': 0,
                'grammar': 0,
              },
              this.unlockedAchievements = const [],
              this.favoriteWords = const [],
              this.lessonProgress = const {},
              this.srsData = const {},
            });

            Map<String, dynamic> toJson() => {
              'fullName': fullName,
              'age': age,
              'cefrLevel': cefrLevel,
              'dailyGoalMinutes': dailyGoalMinutes,
              'totalXp': totalXp,
              'streakDays': streakDays,
              'hearts': hearts,
              'maxHearts': maxHearts,
              'lastActivityDate': lastActivityDate?.toIso8601String(),
              'skillScores': skillScores,
              'unlockedAchievements': unlockedAchievements,
              'favoriteWords': favoriteWords,
              'lessonProgress': lessonProgress,
              'srsData': srsData,
            };

            factory UserProfile.fromJson(Map<String, dynamic> json) => UserProfile(
              fullName: json['fullName'] ?? '',
              age: json['age'] ?? 0,
              cefrLevel: json['cefrLevel'] ?? 'A1',
              dailyGoalMinutes: json['dailyGoalMinutes'] ?? 15,
              totalXp: json['totalXp'] ?? 0,
              streakDays: json['streakDays'] ?? 0,
              hearts: json['hearts'] ?? 5,
              maxHearts: json['maxHearts'] ?? 5,
              lastActivityDate: json['lastActivityDate'] != null
                  ? DateTime.parse(json['lastActivityDate'])
                  : null,
              skillScores: Map<String, int>.from(json['skillScores'] ?? {}),
              unlockedAchievements: List<String>.from(json['unlockedAchievements'] ?? []),
              favoriteWords: List<String>.from(json['favoriteWords'] ?? []),
              lessonProgress: Map<String, int>.from(json['lessonProgress'] ?? {}),
              srsData: Map<String, String>.from(json['srsData'] ?? {}),
            );

            UserProfile copyWith({
              String? fullName,
              int? age,
              String? cefrLevel,
              int? dailyGoalMinutes,
              int? totalXp,
              int? streakDays,
              int? hearts,
              int? maxHearts,
              DateTime? lastActivityDate,
              Map<String, int>? skillScores,
              List<String>? unlockedAchievements,
              List<String>? favoriteWords,
              Map<String, int>? lessonProgress,
              Map<String, String>? srsData,
            }) {
              return UserProfile(
                fullName: fullName ?? this.fullName,
                age: age ?? this.age,
                cefrLevel: cefrLevel ?? this.cefrLevel,
                dailyGoalMinutes: dailyGoalMinutes ?? this.dailyGoalMinutes,
                totalXp: totalXp ?? this.totalXp,
                streakDays: streakDays ?? this.streakDays,
                hearts: hearts ?? this.hearts,
                maxHearts: maxHearts ?? this.maxHearts,
                lastActivityDate: lastActivityDate ?? this.lastActivityDate,
                skillScores: skillScores ?? this.skillScores,
                unlockedAchievements: unlockedAchievements ?? this.unlockedAchievements,
                favoriteWords: favoriteWords ?? this.favoriteWords,
                lessonProgress: lessonProgress ?? this.lessonProgress,
                srsData: srsData ?? this.srsData,
              );
            }
          }

          class VocabularyWord {
            final String id;
            final String word;
            final String translation;
            final String phonetic;
            final String partOfSpeech;
            final String exampleSentence;
            final String exampleTranslation;
            final List<String> tags;
            final int frequencyRank;

            VocabularyWord({
              required this.id,
              required this.word,
              required this.translation,
              this.phonetic = '',
              this.partOfSpeech = 'noun',
              this.exampleSentence = '',
              this.exampleTranslation = '',
              this.tags = const [],
              this.frequencyRank = 1000,
            });

            Map<String, dynamic> toJson() => {
              'id': id,
              'word': word,
              'translation': translation,
              'phonetic': phonetic,
              'partOfSpeech': partOfSpeech,
              'exampleSentence': exampleSentence,
              'exampleTranslation': exampleTranslation,
              'tags': tags,
              'frequencyRank': frequencyRank,
            };

            factory VocabularyWord.fromJson(Map<String, dynamic> json) => VocabularyWord(
              id: json['id'] ?? '',
              word: json['word'] ?? '',
              translation: json['translation'] ?? '',
              phonetic: json['phonetic'] ?? '',
              partOfSpeech: json['partOfSpeech'] ?? 'noun',
              exampleSentence: json['exampleSentence'] ?? '',
              exampleTranslation: json['exampleTranslation'] ?? '',
              tags: List<String>.from(json['tags'] ?? []),
              frequencyRank: json['frequencyRank'] ?? 1000,
            );
          }

          class Lesson {
            final String id;
            final String title;
            final String description;
            final String cefrLevel;
            final int orderIndex;
            final int requiredXp;
            final List<Exercise> exercises;
            final List<String> vocabularyIds;

            Lesson({
              required this.id,
              required this.title,
              required this.description,
              required this.cefrLevel,
              required this.orderIndex,
              this.requiredXp = 0,
              this.exercises = const [],
              this.vocabularyIds = const [],
            });

            Map<String, dynamic> toJson() => {
              'id': id,
              'title': title,
              'description': description,
              'cefrLevel': cefrLevel,
              'orderIndex': orderIndex,
              'requiredXp': requiredXp,
              'exercises': exercises.map((e) => e.toJson()).toList(),
              'vocabularyIds': vocabularyIds,
            };

            factory Lesson.fromJson(Map<String, dynamic> json) => Lesson(
              id: json['id'] ?? '',
              title: json['title'] ?? '',
              description: json['description'] ?? '',
              cefrLevel: json['cefrLevel'] ?? 'A1',
              orderIndex: json['orderIndex'] ?? 0,
              requiredXp: json['requiredXp'] ?? 0,
              exercises: (json['exercises'] as List?)
                  ?.map((e) => Exercise.fromJson(e))
                  .toList() ?? [],
              vocabularyIds: List<String>.from(json['vocabularyIds'] ?? []),
            );
          }

          class Exercise {
            final String id;
            final String lessonId;
            final int orderIndex;
            final String type;
            final String question;
            final List<String> options;
            final String correctAnswer;
            final String explanation;
            final int xpReward;

            Exercise({
              required this.id,
              required this.lessonId,
              required this.orderIndex,
              required this.type,
              required this.question,
              this.options = const [],
              this.correctAnswer = '',
              this.explanation = '',
              this.xpReward = 10,
            });

            Map<String, dynamic> toJson() => {
              'id': id,
              'lessonId': lessonId,
              'orderIndex': orderIndex,
              'type': type,
              'question': question,
              'options': options,
              'correctAnswer': correctAnswer,
              'explanation': explanation,
              'xpReward': xpReward,
            };

            factory Exercise.fromJson(Map<String, dynamic> json) => Exercise(
              id: json['id'] ?? '',
              lessonId: json['lessonId'] ?? '',
              orderIndex: json['orderIndex'] ?? 0,
              type: json['type'] ?? 'singleChoice',
              question: json['question'] ?? '',
              options: List<String>.from(json['options'] ?? []),
              correctAnswer: json['correctAnswer'] ?? '',
              explanation: json['explanation'] ?? '',
              xpReward: json['xpReward'] ?? 10,
            );
          }

          class DialogueTurn {
            final String speaker;
            final String text;
            final String translation;
            final String? audioPath;

            DialogueTurn({
              required this.speaker,
              required this.text,
              required this.translation,
              this.audioPath,
            });

            Map<String, dynamic> toJson() => {
              'speaker': speaker,
              'text': text,
              'translation': translation,
              'audioPath': audioPath,
            };

            factory DialogueTurn.fromJson(Map<String, dynamic> json) => DialogueTurn(
              speaker: json['speaker'] ?? '',
              text: json['text'] ?? '',
              translation: json['translation'] ?? '',
              audioPath: json['audioPath'],
            );
          }

          class PodcastEpisode {
            final String id;
            final String title;
            final String description;
            final String cefrLevel;
            final String audioPath;
            final int durationSeconds;
            final List<TranscriptSegment> transcript;

            PodcastEpisode({
              required this.id,
              required this.title,
              required this.description,
              required this.cefrLevel,
              required this.audioPath,
              required this.durationSeconds,
              this.transcript = const [],
            });

            Map<String, dynamic> toJson() => {
              'id': id,
              'title': title,
              'description': description,
              'cefrLevel': cefrLevel,
              'audioPath': audioPath,
              'durationSeconds': durationSeconds,
              'transcript': transcript.map((t) => t.toJson()).toList(),
            };

            factory PodcastEpisode.fromJson(Map<String, dynamic> json) => PodcastEpisode(
              id: json['id'] ?? '',
              title: json['title'] ?? '',
              description: json['description'] ?? '',
              cefrLevel: json['cefrLevel'] ?? 'A1',
              audioPath: json['audioPath'] ?? '',
              durationSeconds: json['durationSeconds'] ?? 0,
              transcript: (json['transcript'] as List?)
                  ?.map((t) => TranscriptSegment.fromJson(t))
                  .toList() ?? [],
            );
          }

          class TranscriptSegment {
            final String text;
            final int startMs;
            final int endMs;

            TranscriptSegment({
              required this.text,
              required this.startMs,
              required this.endMs,
            });

            Map<String, dynamic> toJson() => {
              'text': text,
              'startMs': startMs,
              'endMs': endMs,
            };

            factory TranscriptSegment.fromJson(Map<String, dynamic> json) => TranscriptSegment(
              text: json['text'] ?? '',
              startMs: json['startMs'] ?? 0,
              endMs: json['endMs'] ?? 0,
            );
          }

          // =========================================
          // 2. STATE MANAGEMENT (Riverpod Providers)
          // =========================================

          final sharedPreferencesProvider = Provider<SharedPreferences>((ref) {
            throw UnimplementedError('Should be overridden in main');
          });

          final userProfileProvider = StateNotifierProvider<UserProfileNotifier, UserProfile>((ref) {
            return UserProfileNotifier(ref);
          });

          class UserProfileNotifier extends StateNotifier<UserProfile> {
            final Ref ref;

            UserProfileNotifier(this.ref) : super(UserProfile(fullName: '', age: 0, cefrLevel: 'A1', dailyGoalMinutes: 15)) {
              _loadProfile();
            }

            Future<void> _loadProfile() async {
              final prefs = ref.read(sharedPreferencesProvider);
              final jsonString = prefs.getString('user_profile');
              if (jsonString != null) {
                try {
                  final json = jsonDecode(jsonString);
                  state = UserProfile.fromJson(json);
                  _checkStreak();
                  _checkHeartRegeneration();
                  return;
                } catch (e) {
                  print('Error loading profile: $e');
                }
              }
              state = UserProfile(
                fullName: '',
                age: 0,
                cefrLevel: 'A1',
                dailyGoalMinutes: 15,
                totalXp: 0,
                streakDays: 0,
                hearts: 5,
                maxHearts: 5,
                lastActivityDate: null,
              );
            }

            void _saveProfile() {
              final prefs = ref.read(sharedPreferencesProvider);
              prefs.setString('user_profile', jsonEncode(state.toJson()));
            }

            void _checkStreak() {
              final now = DateTime.now();
              final today = DateTime(now.year, now.month, now.day);
              final lastActive = state.lastActivityDate;
              if (lastActive == null) return;
              final lastDay = DateTime(lastActive.year, lastActive.month, lastActive.day);
              final difference = today.difference(lastDay).inDays;
              if (difference > 1) {
                state = state.copyWith(streakDays: 0);
                _saveProfile();
              }
            }

            void _checkHeartRegeneration() {
              final now = DateTime.now();
              final lastActive = state.lastActivityDate;
              if (lastActive == null) return;
              final hoursSinceLast = now.difference(lastActive).inHours;
              if (hoursSinceLast >= 6 && state.hearts < state.maxHearts) {
                final newHearts = min(state.hearts + (hoursSinceLast ~/ 6), state.maxHearts);
                state = state.copyWith(hearts: newHearts);
                _saveProfile();
              }
            }

            void updateProfile(UserProfile newProfile) {
              state = newProfile;
              _saveProfile();
            }

            void addXp(int amount) {
              state = state.copyWith(totalXp: state.totalXp + amount);
              _checkAchievements();
              _saveProfile();
            }

            void updateStreak() {
              final now = DateTime.now();
              final today = DateTime(now.year, now.month, now.day);
              final lastActive = state.lastActivityDate;
              int newStreak = state.streakDays;
              if (lastActive == null) {
                newStreak = 1;
              } else {
                final lastDay = DateTime(lastActive.year, lastActive.month, lastActive.day);
                if (today.difference(lastDay).inDays == 1) {
                  newStreak = state.streakDays + 1;
                } else if (today.difference(lastDay).inDays == 0) {
                  newStreak = state.streakDays;
                } else {
                  newStreak = 1;
                }
              }
              state = state.copyWith(streakDays: newStreak, lastActivityDate: now);
              _checkAchievements();
              _saveProfile();
            }

            bool loseHeart() {
              if (state.hearts <= 0) return false;
              state = state.copyWith(hearts: state.hearts - 1);
              _saveProfile();
              return true;
            }

            void updateSkill(String skill, int score) {
              final newScores = Map<String, int>.from(state.skillScores);
              newScores[skill] = (newScores[skill] ?? 0) + score;
              state = state.copyWith(skillScores: newScores);
              _checkAchievements();
              _saveProfile();
            }

            void toggleFavorite(String wordId) {
              final favorites = List<String>.from(state.favoriteWords);
              if (favorites.contains(wordId)) {
                favorites.remove(wordId);
              } else {
                favorites.add(wordId);
              }
              state = state.copyWith(favoriteWords: favorites);
              _saveProfile();
            }

            void updateLessonProgress(String lessonId, int score) {
              final progress = Map<String, int>.from(state.lessonProgress);
              final currentScore = progress[lessonId] ?? 0;
              if (score > currentScore) {
                progress[lessonId] = score;
              }
              state = state.copyWith(lessonProgress: progress);
              _checkAchievements();
              _saveProfile();
            }

            void updateSRSData(String wordId, String grade) {
              final srs = Map<String, String>.from(state.srsData);
              srs[wordId] = grade;
              state = state.copyWith(srsData: srs);
              _saveProfile();
            }

            void _checkAchievements() {
              final newAchievements = List<String>.from(state.unlockedAchievements);
              final achievements = _getAllAchievements();
              for (final achievement in achievements) {
                if (newAchievements.contains(achievement.id)) continue;
                if (_shouldUnlockAchievement(achievement)) {
                  newAchievements.add(achievement.id);
                }
              }
              if (newAchievements.length != state.unlockedAchievements.length) {
                state = state.copyWith(unlockedAchievements: newAchievements);
                _saveProfile();
              }
            }

            List<Achievement> _getAllAchievements() => [
              Achievement(id: 'first_lesson', title: 'First Steps', description: 'Complete your first lesson', icon: '🎓', condition: 'lessons >= 1'),
              Achievement(id: 'xp_100', title: 'Knowledge Seeker', description: 'Earn 100 XP', icon: '⭐', condition: 'xp >= 100'),
              Achievement(id: 'streak_7', title: 'Weekly Warrior', description: '7-day streak', icon: '🔥', condition: 'streak >= 7'),
              Achievement(id: 'xp_500', title: 'Language Enthusiast', description: 'Earn 500 XP', icon: '🌟', condition: 'xp >= 500'),
              Achievement(id: 'streak_30', title: 'Monthly Master', description: '30-day streak', icon: '👑', condition: 'streak >= 30'),
              Achievement(id: 'xp_1000', title: 'Polyglot Master', description: 'Earn 1000 XP', icon: '🏆', condition: 'xp >= 1000'),
            ];

            bool _shouldUnlockAchievement(Achievement achievement) {
              final parts = achievement.condition.split(' ');
              final type = parts[0];
              final value = int.parse(parts[2]);
              switch (type) {
                case 'xp': return state.totalXp >= value;
                case 'streak': return state.streakDays >= value;
                case 'lessons': return state.lessonProgress.length >= value;
                default: return false;
              }
            }

            void resetProgress() {
              state = UserProfile(
                fullName: state.fullName,
                age: state.age,
                cefrLevel: state.cefrLevel,
                dailyGoalMinutes: state.dailyGoalMinutes,
                totalXp: 0,
                streakDays: 0,
                hearts: 5,
                maxHearts: 5,
                lastActivityDate: null,
              );
              _saveProfile();
            }
          }

          class Achievement {
            final String id;
            final String title;
            final String description;
            final String icon;
            final String condition;

            Achievement({
              required this.id,
              required this.title,
              required this.description,
              required this.icon,
              required this.condition,
            });
          }

          final themeModeProvider = StateNotifierProvider<ThemeModeNotifier, ThemeMode>((ref) {
            return ThemeModeNotifier(ref);
          });

          class ThemeModeNotifier extends StateNotifier<ThemeMode> {
            final Ref ref;

            ThemeModeNotifier(this.ref) : super(ThemeMode.dark) {
              _loadTheme();
            }

            void _loadTheme() {
              final prefs = ref.read(sharedPreferencesProvider);
              final isDark = prefs.getBool('dark_mode') ?? true;
              state = isDark ? ThemeMode.dark : ThemeMode.light;
            }

            void toggleTheme() {
              final prefs = ref.read(sharedPreferencesProvider);
              final isDark = state == ThemeMode.dark;
              state = isDark ? ThemeMode.light : ThemeMode.dark;
              prefs.setBool('dark_mode', state == ThemeMode.dark);
            }
          }

          final dictionaryProvider = StateNotifierProvider<DictionaryNotifier, List<VocabularyWord>>((ref) {
            return DictionaryNotifier();
          });

          class DictionaryNotifier extends StateNotifier<List<VocabularyWord>> {
            DictionaryNotifier() : super([]) {
              _loadDictionary();
            }

            void _loadDictionary() {
              state = [
                VocabularyWord(id: 'w1', word: 'hello', translation: 'مرحباً', phonetic: '/həˈləʊ/', partOfSpeech: 'interjection', exampleSentence: 'Hello, how are you?', exampleTranslation: 'مرحباً، كيف حالك؟'),
                VocabularyWord(id: 'w2', word: 'goodbye', translation: 'وداعاً', phonetic: '/ɡʊdˈbaɪ/', partOfSpeech: 'interjection', exampleSentence: 'Goodbye, see you tomorrow', exampleTranslation: 'وداعاً، أراك غداً'),
                VocabularyWord(id: 'w3', word: 'thank you', translation: 'شكراً لك', phonetic: '/θæŋk juː/', partOfSpeech: 'interjection', exampleSentence: 'Thank you for your help', exampleTranslation: 'شكراً لك على مساعدتك'),
                VocabularyWord(id: 'w4', word: 'please', translation: 'من فضلك', phonetic: '/pliːz/', partOfSpeech: 'interjection', exampleSentence: 'Please help me', exampleTranslation: 'من فضلك ساعدني'),
                VocabularyWord(id: 'w5', word: 'perseverance', translation: 'المثابرة والإصرار', phonetic: '/ˌpɜː.sɪˈvɪə.rəns/', partOfSpeech: 'noun', exampleSentence: 'Success requires perseverance', exampleTranslation: 'النجاح يتطلب المثابرة'),
                VocabularyWord(id: 'w6', word: 'opportunity', translation: 'فرصة ثمينة', phonetic: '/ˌɒp.əˈtjuː.nə.ti/', partOfSpeech: 'noun', exampleSentence: 'Seize every opportunity', exampleTranslation: 'اغتنم كل فرصة'),
                VocabularyWord(id: 'w7', word: 'fluent', translation: 'فصيح / طليق اللسان', phonetic: '/ˈfluː.ənt/', partOfSpeech: 'adjective', exampleSentence: 'She speaks fluent English', exampleTranslation: 'هي تتحدث الإنجليزية بطلاقة'),
                VocabularyWord(id: 'w8', word: 'knowledge', translation: 'معرفة / علم', phonetic: '/ˈnɒl.ɪdʒ/', partOfSpeech: 'noun', exampleSentence: 'Knowledge is real power', exampleTranslation: 'المعرفة هي القوة الحقيقية'),
              ];
            }

            List<VocabularyWord> search(String query) {
              if (query.isEmpty) return [];
              final q = query.toLowerCase();
              return state.where((w) => w.word.toLowerCase().contains(q) || w.translation.contains(q)).toList();
            }
          }

          final ttsServiceProvider = Provider<FlutterTts>((ref) {
            final tts = FlutterTts();
            tts.setLanguage('en-US');
            tts.setSpeechRate(0.48);
            tts.setPitch(1.0);
            return tts;
          });

          // =========================================
          // 3. MAIN APP
          // =========================================

          void main() async {
            WidgetsFlutterBinding.ensureInitialized();
            final prefs = await SharedPreferences.getInstance();
            runApp(
              ProviderScope(
                overrides: [
                  sharedPreferencesProvider.overrideWithValue(prefs),
                ],
                child: const PolyglotMasterApp(),
              ),
            );
          }

          class PolyglotMasterApp extends ConsumerWidget {
            const PolyglotMasterApp({super.key});

            @override
            Widget build(BuildContext context, WidgetRef ref) {
              final themeMode = ref.watch(themeModeProvider);
              final profile = ref.watch(userProfileProvider);
              final isLoggedIn = profile.fullName.isNotEmpty;

              return MaterialApp(
                title: 'PolyglotMaster English',
                debugShowCheckedModeBanner: false,
                theme: ThemeData(
                  useMaterial3: true,
                  brightness: Brightness.light,
                  colorSchemeSeed: const Color(0xFF2563EB),
                  fontFamily: GoogleFonts.inter().fontFamily,
                ),
                darkTheme: ThemeData(
