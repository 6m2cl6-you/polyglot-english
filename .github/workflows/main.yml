name: Build Android APK v1.0.1

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Set up Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Create Complete Flutter Production App
        run: |
          flutter create polyglot_master --platforms=android --org com.polyglotmaster.app
          cd polyglot_master

          cat << 'EOF' > pubspec.yaml
          name: polyglot_master
          description: "PolyglotMaster English - 100% Offline Platform"
          publish_to: 'none'
          version: 1.0.1+2

          environment:
            sdk: '>=3.0.0 <4.0.0'

          dependencies:
            flutter:
              sdk: flutter
            flutter_riverpod: ^2.5.1
            shared_preferences: ^2.2.3
            flutter_tts: ^4.0.2

          flutter:
            uses-material-design: true
          EOF

          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/g' android/app/build.gradle || true
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 21/g' android/app/build.gradle || true

          cat << 'EOF' > lib/main.dart
          import 'dart:convert';
          import 'package:flutter/material.dart';
          import 'package:flutter_riverpod/flutter_riverpod.dart';
          import 'package:shared_preferences/shared_preferences.dart';
          import 'package:flutter_tts/flutter_tts.dart';

          // ----------------------------------------------------
          // 1. DATA MODELS
          // ----------------------------------------------------
          class UserProfile {
            final String fullName;
            final int age;
            final String cefrLevel;
            final int dailyGoalMinutes;
            final int totalXp;
            final int streakDays;
            final int hearts;
            final List<String> favoriteWords;

            UserProfile({
              required this.fullName,
              required this.age,
              required this.cefrLevel,
              required this.dailyGoalMinutes,
              this.totalXp = 0,
              this.streakDays = 1,
              this.hearts = 5,
              this.favoriteWords = const [],
            });

            Map<String, dynamic> toJson() => {
              'fullName': fullName,
              'age': age,
              'cefrLevel': cefrLevel,
              'dailyGoalMinutes': dailyGoalMinutes,
              'totalXp': totalXp,
              'streakDays': streakDays,
              'hearts': hearts,
              'favoriteWords': favoriteWords,
            };

            factory UserProfile.fromJson(Map<String, dynamic> json) => UserProfile(
              fullName: json['fullName'] ?? '',
              age: json['age'] ?? 20,
              cefrLevel: json['cefrLevel'] ?? 'A1',
              dailyGoalMinutes: json['dailyGoalMinutes'] ?? 15,
              totalXp: json['totalXp'] ?? 0,
              streakDays: json['streakDays'] ?? 1,
              hearts: json['hearts'] ?? 5,
              favoriteWords: List<String>.from(json['favoriteWords'] ?? []),
            );

            UserProfile copyWith({
              String? fullName,
              int? age,
              String? cefrLevel,
              int? dailyGoalMinutes,
              int? totalXp,
              int? streakDays,
              int? hearts,
              List<String>? favoriteWords,
            }) {
              return UserProfile(
                fullName: fullName ?? this.fullName,
                age: age ?? this.age,
                cefrLevel: cefrLevel ?? this.cefrLevel,
                dailyGoalMinutes: dailyGoalMinutes ?? this.dailyGoalMinutes,
                totalXp: totalXp ?? this.totalXp,
                streakDays: streakDays ?? this.streakDays,
                hearts: hearts ?? this.hearts,
                favoriteWords: favoriteWords ?? this.favoriteWords,
              );
            }
          }

          class VocabularyWord {
            final String id;
            final String word;
            final String translation;
            final String phonetic;
            final String exampleSentence;
            final String exampleTranslation;

            VocabularyWord({
              required this.id,
              required this.word,
              required this.translation,
              required this.phonetic,
              required this.exampleSentence,
              required this.exampleTranslation,
            });
          }

          // ----------------------------------------------------
          // 2. PROVIDERS & STATE
          // ----------------------------------------------------
          final sharedPreferencesProvider = Provider<SharedPreferences>((ref) => throw UnimplementedError());

          final userProfileProvider = StateNotifierProvider<UserProfileNotifier, UserProfile>((ref) {
            return UserProfileNotifier(ref);
          });

          class UserProfileNotifier extends StateNotifier<UserProfile> {
            final Ref ref;
            UserProfileNotifier(this.ref) : super(UserProfile(fullName: '', age: 0, cefrLevel: 'A1', dailyGoalMinutes: 15)) {
              _load();
            }

            void _load() {
              final prefs = ref.read(sharedPreferencesProvider);
              final str = prefs.getString('user_profile');
              if (str != null) {
                try {
                  state = UserProfile.fromJson(jsonDecode(str));
                } catch (_) {}
              }
            }

            void _save() {
              final prefs = ref.read(sharedPreferencesProvider);
              prefs.setString('user_profile', jsonEncode(state.toJson()));
            }

            void updateProfile(UserProfile p) {
              state = p;
              _save();
            }

            void addXp(int xp) {
              state = state.copyWith(totalXp: state.totalXp + xp);
              _save();
            }

            void loseHeart() {
              if (state.hearts > 0) {
                state = state.copyWith(hearts: state.hearts - 1);
                _save();
              }
            }

            void toggleFavorite(String id) {
              final favs = List<String>.from(state.favoriteWords);
              if (favs.contains(id)) {
                favs.remove(id);
              } else {
                favs.add(id);
              }
              state = state.copyWith(favoriteWords: favs);
              _save();
            }

            void resetProgress() {
              state = UserProfile(
                fullName: state.fullName,
                age: state.age,
                cefrLevel: state.cefrLevel,
                dailyGoalMinutes: state.dailyGoalMinutes,
                totalXp: 0,
                streakDays: 1,
                hearts: 5,
                favoriteWords: [],
              );
              _save();
            }
          }

          final themeModeProvider = StateNotifierProvider<ThemeModeNotifier, ThemeMode>((ref) {
            return ThemeModeNotifier(ref);
          });

          class ThemeModeNotifier extends StateNotifier<ThemeMode> {
            final Ref ref;
            ThemeModeNotifier(this.ref) : super(ThemeMode.dark) {
              final prefs = ref.read(sharedPreferencesProvider);
              final isDark = prefs.getBool('is_dark') ?? true;
              state = isDark ? ThemeMode.dark : ThemeMode.light;
            }

            void toggleTheme() {
              final prefs = ref.read(sharedPreferencesProvider);
              final isDark = state == ThemeMode.dark;
              state = isDark ? ThemeMode.light : ThemeMode.dark;
              prefs.setBool('is_dark', state == ThemeMode.dark);
            }
          }

          final ttsProvider = Provider<FlutterTts>((ref) {
            final tts = FlutterTts();
            tts.setLanguage('en-US');
            tts.setSpeechRate(0.48);
            tts.setPitch(1.0);
            return tts;
          });

          final dictionaryData = [
            VocabularyWord(id: 'w1', word: 'Hello', translation: 'مرحباً', phonetic: '/həˈloʊ/', exampleSentence: 'Hello, how are you today?', exampleTranslation: 'مرحباً، كيف حالك اليوم؟'),
            VocabularyWord(id: 'w2', word: 'Perseverance', translation: 'المثابرة والإصرار', phonetic: '/ˌpɜːrsəˈvɪrəns/', exampleSentence: 'Success requires constant perseverance.', exampleTranslation: 'النجاح يتطلب المثابرة المستمرة.'),
            VocabularyWord(id: 'w3', word: 'Opportunity', translation: 'فرصة ثمينة', phonetic: '/ˌɑːpərˈtuːnəti/', exampleSentence: 'Always seize every learning opportunity.', exampleTranslation: 'اغتنم دائماً كل فرصة للتعلم.'),
            VocabularyWord(id: 'w4', word: 'Fluent', translation: 'فصيح / طليق اللسان', phonetic: '/ˈfluːənt/', exampleSentence: 'You will become fluent in English.', exampleTranslation: 'ستصبح طليق اللسان في الإنجليزية.'),
            VocabularyWord(id: 'w5', word: 'Knowledge', translation: 'المعرفة / العلم', phonetic: '/ˈnɑːlɪdʒ/', exampleSentence: 'Knowledge is the greatest power.', exampleTranslation: 'المعرفة هي أعظم قوة.'),
            VocabularyWord(id: 'w6', word: 'Confidence', translation: 'الثقة بالنفس', phonetic: '/ˈkɑːnfɪdəns/', exampleSentence: 'Speak English with total confidence.', exampleTranslation: 'تحدث الإنجليزية بثقة تامة.'),
            VocabularyWord(id: 'w7', word: 'Achievement', translation: 'إنجاز عظيم', phonetic: '/əˈtʃiːvmənt/', exampleSentence: 'Completing this course is an achievement.', exampleTranslation: 'إكمال هذه الدورة هو إنجاز.'),
            VocabularyWord(id: 'w8', word: 'Determination', translation: 'العزيمة والإرادة', phonetic: '/dɪˌtɜːrmɪˈneɪʃn/', exampleSentence: 'Determination leads to success.', exampleTranslation: 'العزيمة تقود إلى النجاح.'),
          ];

          // ----------------------------------------------------
          // 3. MAIN APP ENTRY
          // ----------------------------------------------------
          void main() async {
            WidgetsFlutterBinding.ensureInitialized();
            final prefs = await SharedPreferences.getInstance();
            runApp(
              ProviderScope(
                overrides: [sharedPreferencesProvider.overrideWithValue(prefs)],
                child: const PolyglotMasterApp(),
              ),
            );
          }

          class PolyglotMasterApp extends ConsumerWidget {
            const PolyglotMasterApp({super.key});

            @override
            Widget build(BuildContext context, WidgetRef ref) {
              final themeMode = ref.watch(themeModeProvider);
              final profile = ref.watch(userProfileProvider);
              final isLoggedIn = profile.fullName.isNotEmpty;

              return MaterialApp(
                title: 'PolyglotMaster English',
                debugShowCheckedModeBanner: false,
                theme: ThemeData(
                  useMaterial3: true,
                  brightness: Brightness.light,
                  colorSchemeSeed: const Color(0xFF2563EB),
                ),
                darkTheme: ThemeData(
                  useMaterial3: true,
                  brightness: Brightness.dark,
                  scaffoldBackgroundColor: const Color(0xFF000000),
                  colorScheme: const ColorScheme.dark(
                    primary: Color(0xFF3B82F6),
                    surface: Color(0xFF121212),
                  ),
                ),
                themeMode: themeMode,
                home: isLoggedIn ? const HomeScreen() : const AuthScreen(),
              );
            }
          }

          // ----------------------------------------------------
          // 4. AUTH SCREEN
          // ----------------------------------------------------
          class AuthScreen extends ConsumerStatefulWidget {
            const AuthScreen({super.key});

            @override
            ConsumerState<AuthScreen> createState() => _AuthScreenState();
          }

          class _AuthScreenState extends ConsumerState<AuthScreen> {
            final _formKey = GlobalKey<FormState>();
            final _nameController = TextEditingController();
            final _ageController = TextEditingController();
            String _level = 'A1';
            int _goal = 15;

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                body: SafeArea(
                  child: Center(
                    child: SingleChildScrollView(
                      padding: const EdgeInsets.all(24),
                      child: Form(
                        key: _formKey,
                        child: Column(
                          mainAxisAlignment: MainAxisAlignment.center,
                          children: [
                            const Icon(Icons.school, size: 80, color: Color(0xFF3B82F6)),
                            const SizedBox(height: 10),
                            const Text('PolyglotMaster', style: TextStyle(fontSize: 32, fontWeight: FontWeight.bold, color: Color(0xFF3B82F6))),
                            const Text('تعلم الإنجليزية بدون إنترنت • 100% Offline', style: TextStyle(color: Colors.grey, fontSize: 15)),
                            const SizedBox(height: 30),
                            TextFormField(
                              controller: _nameController,
                              decoration: const InputDecoration(labelText: 'الاسم الكامل / Full Name', prefixIcon: Icon(Icons.person), border: OutlineInputBorder()),
                              validator: (v) => v!.isEmpty ? 'يرجى إدخال اسمك' : null,
                            ),
                            const SizedBox(height: 14),
                            TextFormField(
                              controller: _ageController,
                              keyboardType: TextInputType.number,
                              decoration: const InputDecoration(labelText: 'العمر / Age', prefixIcon: Icon(Icons.cake), border: OutlineInputBorder()),
                              validator: (v) => v!.isEmpty ? 'يرجى إدخال عمرك' : null,
                            ),
                            const SizedBox(height: 14),
                            DropdownButtonFormField<String>(
                              value: _level,
                              decoration: const InputDecoration(labelText: 'المستوى / English Level', prefixIcon: Icon(Icons.stacked_line_chart), border: OutlineInputBorder()),
                              items: ['A1', 'A2', 'B1', 'B2', 'C1', 'C2'].map((l) => DropdownMenuItem(value: l, child: Text('Level $l'))).toList(),
                              onChanged: (v) => setState(() => _level = v!),
                            ),
                            const SizedBox(height: 14),
                            DropdownButtonFormField<int>(
                              value: _goal,
                              decoration: const InputDecoration(labelText: 'الهدف اليومي / Daily Goal', prefixIcon: Icon(Icons.timer), border: OutlineInputBorder()),
                              items: [5, 15, 30].map((g) => DropdownMenuItem(value: g, child: Text('$g دقيقة / Minutes'))).toList(),
                              onChanged: (v) => setState(() => _goal = v!),
                            ),
                            const SizedBox(height: 24),
                            ElevatedButton(
                              style: ElevatedButton.styleFrom(backgroundColor: const Color(0xFF3B82F6), foregroundColor: Colors.white, minimumSize: const Size(double.infinity, 54), shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(14))),
                              onPressed: _start,
                              child: const Text('ابدأ التعلم الآن 🚀', style: TextStyle(fontSize: 18, fontWeight: FontWeight.bold)),
                            )
                          ],
                        ),
                      ),
                    ),
                  ),
                ),
              );
            }

            void _start() {
              if (!_formKey.currentState!.validate()) return;
              ref.read(userProfileProvider.notifier).updateProfile(
                UserProfile(
                  fullName: _nameController.text.trim(),
                  age: int.tryParse(_ageController.text.trim()) ?? 20,
                  cefrLevel: _level,
                  dailyGoalMinutes: _goal,
                  totalXp: 0,
                  streakDays: 1,
                  hearts: 5,
                ),
              );
            }
          }

          // ----------------------------------------------------
          // 5. MAIN SHELL & TABS
          // ----------------------------------------------------
          class HomeScreen extends ConsumerStatefulWidget {
            const HomeScreen({super.key});

            @override
            ConsumerState<HomeScreen> createState() => _HomeScreenState();
          }

          class _HomeScreenState extends ConsumerState<HomeScreen> {
            int _currentIndex = 0;
            final _tabs = const [
              LessonsTab(),
              FlashcardsTab(),
              DialoguesTab(),
              PodcastsTab(),
              ProfileTab(),
            ];

            @override
            Widget build(BuildContext context) {
              final profile = ref.watch(userProfileProvider);

              return Scaffold(
                appBar: AppBar(
                  title: const Text('PolyglotMaster English', style: TextStyle(fontWeight: FontWeight.bold, fontSize: 18)),
                  actions: [
                    Row(
                      children: [
                        const Icon(Icons.local_fire_department, color: Colors.orange, size: 20),
                        Text(' ${profile.streakDays} ', style: const TextStyle(fontWeight: FontWeight.bold)),
                        const Icon(Icons.favorite, color: Colors.red, size: 20),
                        Text(' ${profile.hearts} ', style: const TextStyle(fontWeight: FontWeight.bold)),
                        const Icon(Icons.stars, color: Colors.amber, size: 20),
                        Text(' ${profile.totalXp} ', style: const TextStyle(fontWeight: FontWeight.bold)),
                        const SizedBox(width: 8),
                      ],
                    )
                  ],
                ),
                drawer: const AppDrawer(),
                body: _tabs[_currentIndex],
                bottomNavigationBar: NavigationBar(
                  selectedIndex: _currentIndex,
                  onDestinationSelected: (i) => setState(() => _currentIndex = i),
                  destinations: const [
                    NavigationDestination(icon: Icon(Icons.school), label: 'الدروس'),
                    NavigationDestination(icon: Icon(Icons.style), label: 'البطاقات'),
                    NavigationDestination(icon: Icon(Icons.chat), label: 'المحادثة'),
                    NavigationDestination(icon: Icon(Icons.podcasts), label: 'بودكاست'),
                    NavigationDestination(icon: Icon(Icons.person), label: 'الملف'),
                  ],
                ),
              );
            }
          }

          // ----------------------------------------------------
          // 6. DRAWER (DICTIONARY, GRAMMAR, FAVORITES)
          // ----------------------------------------------------
          class AppDrawer extends ConsumerWidget {
            const AppDrawer({super.key});

            @override
            Widget build(BuildContext context, WidgetRef ref) {
              final profile = ref.watch(userProfileProvider);
              return Drawer(
                child: Column(
                  children: [
                    UserAccountsDrawerHeader(
                      decoration: const BoxDecoration(color: Color(0xFF2563EB)),
                      accountName: Text(profile.fullName, style: const TextStyle(fontSize: 18, fontWeight: FontWeight.bold)),
                      accountEmail: Text('Level ${profile.cefrLevel} • ${profile.totalXp} XP • ${profile.streakDays} Days 🔥'),
                      currentAccountPicture: CircleAvatar(
                        backgroundColor: Colors.white,
                        child: Text(profile.fullName.isNotEmpty ? profile.fullName[0].toUpperCase() : 'P', style: const TextStyle(fontSize: 28, color: Color(0xFF2563EB), fontWeight: FontWeight.bold)),
                      ),
                    ),
                    ListTile(
                      leading: const Icon(Icons.translate, color: Color(0xFF3B82F6)),
                      title: const Text('القاموس والمترجم الفوري (Offline)'),
                      onTap: () => _openSheet(context, const DictionarySheet()),
                    ),
                    ListTile(
                      leading: const Icon(Icons.menu_book, color: Colors.purple),
                      title: const Text('ملخص القواعد النحوية (Grammar)'),
                      onTap: () => _openSheet(context, const GrammarSheet()),
                    ),
                    ListTile(
                      leading: const Icon(Icons.favorite, color: Colors.red),
                      title: const Text('الكلمات المفضلة (Favorites)'),
                      onTap: () => _openSheet(context, const FavoritesSheet()),
                    ),
                    const Divider(),
                    ListTile(
                      leading: const Icon(Icons.brightness_4),
                      title: const Text('تبديل الوضع المظلم (Dark Mode)'),
                      onTap: () => ref.read(themeModeProvider.notifier).toggleTheme(),
                    ),
                    ListTile(
                      leading: const Icon(Icons.restart_alt, color: Colors.red),
                      title: const Text('إعادة تعيين التقدم (Reset)'),
                      onTap: () => ref.read(userProfileProvider.notifier).resetProgress(),
                    ),
                  ],
                ),
              );
            }

            void _openSheet(BuildContext context, Widget sheet) {
              showModalBottomSheet(context: context, isScrollControlled: true, builder: (_) => sheet);
            }
          }

          class DictionarySheet extends ConsumerStatefulWidget {
            const DictionarySheet({super.key});

            @override
            ConsumerState<DictionarySheet> createState() => _DictionarySheetState();
          }

          class _DictionarySheetState extends ConsumerState<DictionarySheet> {
            final _c = TextEditingController();
            List<VocabularyWord> _res = dictionaryData;

            @override
            Widget build(BuildContext context) {
              final tts = ref.watch(ttsProvider);
              final favs = ref.watch(userProfileProvider).favoriteWords;

              return Padding(
                padding: EdgeInsets.only(top: 20, left: 16, right: 16, bottom: MediaQuery.of(context).viewInsets.bottom + 20),
                child: SizedBox(
                  height: MediaQuery.of(context).size.height * 0.75,
                  child: Column(
                    children: [
                      const Text('📖 القاموس الفوري الأوفلاين', style: TextStyle(fontSize: 20, fontWeight: FontWeight.bold)),
                      const SizedBox(height: 12),
                      TextField(
                        controller: _c,
                        decoration: const InputDecoration(labelText: 'ابحث بالإنجليزية أو العربية...', prefixIcon: Icon(Icons.search), border: OutlineInputBorder()),
                        onChanged: (v) {
                          setState(() {
                            _res = dictionaryData.where((w) => w.word.toLowerCase().contains(v.toLowerCase()) || w.translation.contains(v)).toList();
                          });
                        },
                      ),
                      const SizedBox(height: 12),
                      Expanded(
                        child: ListView.builder(
                          itemCount: _res.length,
                          itemBuilder: (ctx, i) {
                            final w = _res[i];
                            final isFav = favs.contains(w.id);
                            return Card(
                              child: ListTile(
                                leading: IconButton(icon: const Icon(Icons.volume_up, color: Color(0xFF3B82F6)), onPressed: () => tts.speak(w.word)),
                                title: Text('${w.word} (${w.phonetic})', style: const TextStyle(fontWeight: FontWeight.bold)),
                                subtitle: Text('${w.translation}\n${w.exampleSentence}'),
                                trailing: IconButton(
                                  icon: Icon(isFav ? Icons.favorite : Icons.favorite_border, color: isFav ? Colors.red : null),
                                  onPressed: () => ref.read(userProfileProvider.notifier).toggleFavorite(w.id),
                                ),
                              ),
                            );
                          },
                        ),
                      )
                    ],
                  ),
                ),
              );
            }
          }

          class GrammarSheet extends StatelessWidget {
            const GrammarSheet({super.key});

            @override
            Widget build(BuildContext context) {
              return Padding(
                padding: const EdgeInsets.all(20),
                child: SizedBox(
                  height: MediaQuery.of(context).size.height * 0.75,
                  child: ListView(
                    children: const [
                      Text('📚 ملخص أهم القواعد النحوية', style: TextStyle(fontSize: 22, fontWeight: FontWeight.bold), textAlign: TextAlign.center),
                      SizedBox(height: 16),
                      Card(
                        child: Padding(
                          padding: EdgeInsets.all(16),
                          child: Column(
                            crossAxisAlignment: CrossAxisAlignment.start,
                            children: [
                              Text('1. Present Simple (المضارع البسيط)', style: TextStyle(fontWeight: FontWeight.bold, fontSize: 16, color: Color(0xFF3B82F6))),
                              SizedBox(height: 4),
                              Text('• للعادات والحقائق الثابتة.\n• القاعدة: I/You/We/They + Verb | He/She/It + Verb(s)\n• مثال: I practice English every day.'),
                            ],
                          ),
                        ),
                      ),
                      Card(
                        child: Padding(
                          padding: EdgeInsets.all(16),
                          child: Column(
                            crossAxisAlignment: CrossAxisAlignment.start,
                            children: [
                              Text('2. Past Simple (الماضي البسيط)', style: TextStyle(fontWeight: FontWeight.bold, fontSize: 16, color: Colors.purple)),
                              SizedBox(height: 4),
                              Text('• لأحداث انتهت في وقت محدد بالماضي.\n• القاعدة: Subject + Verb(ed/2nd form)\n• مثال: We learned 20 new words yesterday.'),
                            ],
                          ),
                        ),
                      ),
                      Card(
                        child: Padding(
                          padding: EdgeInsets.all(16),
                          child: Column(
                            crossAxisAlignment: CrossAxisAlignment.start,
                            children: [
                              Text('3. Modals: Can, Should, Must', style: TextStyle(fontWeight: FontWeight.bold, fontSize: 16, color: Colors.green)),
                              SizedBox(height: 4),
                              Text('• Can: للقدرة (I can speak).\n• Should: للنصيحة (You should practice).\n• Must: للضرورة (You must believe in yourself).'),
                            ],
                          ),
                        ),
                      ),
                    ],
                  ),
                ),
              );
            }
          }

          class FavoritesSheet extends ConsumerWidget {
            const FavoritesSheet({super.key});

            @override
            Widget build(BuildContext context, WidgetRef ref) {
              final tts = ref.watch(ttsProvider);
              final favIds = ref.watch(userProfileProvider).favoriteWords;
              final favWords = dictionaryData.where((w) => favIds.contains(w.id)).toList();

              return Padding(
                padding: const EdgeInsets.all(20),
                child: SizedBox(
                  height: MediaQuery.of(context).size.height * 0.65,
                  child: Column(
                    children: [
                      const Text('❤️ الكلمات المفضلة المحفوظة', style: TextStyle(fontSize: 20, fontWeight: FontWeight.bold)),
                      const SizedBox(height: 12),
                      Expanded(
                        child: favWords.isEmpty
                            ? const Center(child: Text('لا توجد كلمات مفضلة حتى الآن! اضغط على القلب لحفظها.'))
                            : ListView.builder(
                                itemCount: favWords.length,
                                itemBuilder: (ctx, i) {
                                  final w = favWords[i];
                                  return Card(
                                    child: ListTile(
                                      leading: IconButton(icon: const Icon(Icons.volume_up, color: Color(0xFF3B82F6)), onPressed: () => tts.speak(w.word)),
                                      title: Text(w.word, style: const TextStyle(fontWeight: FontWeight.bold)),
                                      subtitle: Text(w.translation),
                                      trailing: IconButton(icon: const Icon(Icons.delete, color: Colors.red), onPressed: () => ref.read(userProfileProvider.notifier).toggleFavorite(w.id)),
                                    ),
                                  );
                                },
                              ),
                      )
                    ],
                  ),
                ),
              );
            }
          }

          // ----------------------------------------------------
          // 7. TAB 1: LESSONS
          // ----------------------------------------------------
          class LessonsTab extends ConsumerWidget {
            const LessonsTab({super.key});

            @override
            Widget build(BuildContext context, WidgetRef ref) {
              final profile = ref.watch(userProfileProvider);
              final levels = [
                {'lvl': 'Level A1: Basics & Greetings', 'ar': 'التحيات والتعريف بالنفس والأساسيات', 'req': 0, 'q': 'How do you say "مرحباً، كيف حالك؟"?', 'opts': ['Hello, how are you?', 'Good night, bye', 'Thank you', 'Excuse me'], 'ans': 'Hello, how are you?'},
                {'lvl': 'Level A2: Daily Routine & Food', 'ar': 'الروتين اليومي والمطاعم والتسوق', 'req': 30, 'q': 'What do you eat for breakfast?', 'opts': ['Pancakes and Eggs', 'Laptop and mouse', 'Car and train', 'Table and chair'], 'ans': 'Pancakes and Eggs'},
                {'lvl': 'Level B1: Travel & Navigation', 'ar': 'السفر والمطارات وحجز الفنادق', 'req': 70, 'q': 'Where do you show your passport?', 'opts': ['Passport Control', 'Restaurant kitchen', 'Cinema room', 'Bus stop'], 'ans': 'Passport Control'},
                {'lvl': 'Level B2: Business & Interviews', 'ar': 'المقابلات الوظيفية ومصطلحات العمل', 'req': 120, 'q': 'What does "Team Player" mean?', 'opts': ['Collaborates with colleagues', 'Plays football alone', 'Never speaks', 'Sleeps at work'], 'ans': 'Collaborates with colleagues'},
                {'lvl': 'Level C1: Advanced Fluency', 'ar': 'المناظرات الفكرية والمصطلحات العميقة', 'req': 180, 'q': 'What does "Bite the bullet" mean?', 'opts': ['Face a difficult situation bravely', 'Eat bullets', 'Go to sleep', 'Cook dinner'], 'ans': 'Face a difficult situation bravely'},
              ];

              return ListView.builder(
                padding: const EdgeInsets.all(16),
                itemCount: levels.length,
                itemBuilder: (ctx, i) {
                  final l = levels[i];
                  final isLocked = profile.totalXp < (l['req'] as int);
                  return Card(
                    margin: const EdgeInsets.only(bottom: 12),
                    shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(16)),
                    child: ListTile(
                      contentPadding: const EdgeInsets.symmetric(horizontal: 16, vertical: 8),
                      leading: CircleAvatar(
                        backgroundColor: isLocked ? Colors.grey.withOpacity(0.2) : const Color(0xFF2563EB).withOpacity(0.15),
                        child: Icon(isLocked ? Icons.lock : Icons.school, color: isLocked ? Colors.grey : const Color(0xFF2563EB)),
                      ),
                      title: Text(l['lvl'] as String, style: TextStyle(fontWeight: FontWeight.bold, color: isLocked ? Colors.grey : null)),
                      subtitle: Text('${l['ar']}\n(مطلوب: ${l['req']} XP)', style: const TextStyle(fontSize: 13)),
                      trailing: const Icon(Icons.arrow_forward_ios, size: 16),
                      onTap: () {
                        if (isLocked) {
                          ScaffoldMessenger.of(context).showSnackBar(SnackBar(content: Text('🔒 مقفل! تحتاج إلى ${l['req']} XP لفتحه.')));
                        } else {
                          _startLesson(context, ref, l['lvl'] as String, l['q'] as String, l['opts'] as List<String>, l['ans'] as String);
                        }
                      },
                    ),
                  );
                },
              );
            }

            void _startLesson(BuildContext context, WidgetRef ref, String title, String q, List<String> opts, String ans) {
              final tts = ref.read(ttsProvider);
              showDialog(
                context: context,
                builder: (ctx) => AlertDialog(
                  title: Text(title, style: const TextStyle(fontSize: 18, fontWeight: FontWeight.bold)),
                  content: Column(
                    mainAxisSize: MainAxisSize.min,
                    children: [
                      Text(q, style: const TextStyle(fontSize: 16, fontWeight: FontWeight.w600)),
                      IconButton(icon: const Icon(Icons.volume_up, color: Color(0xFF3B82F6)), onPressed: () => tts.speak(q)),
                      const SizedBox(height: 12),
                      ...opts.map((opt) => Padding(
                            padding: const EdgeInsets.only(bottom: 8),
                            child: ElevatedButton(
                              style: ElevatedButton.styleFrom(minimumSize: const Size(double.infinity, 44)),
                              onPressed: () {
                                Navigator.pop(ctx);
                                final isCorrect = opt == ans;
                                if (isCorrect) {
                                  ref.read(userProfileProvider.notifier).addXp(15);
                                  ScaffoldMessenger.of(context).showSnackBar(const SnackBar(backgroundColor: Colors.green, content: Text('✅ إجابة صحيحة! +15 XP ⭐')));
                                } else {
                                  ref.read(userProfileProvider.notifier).loseHeart();
                                  ScaffoldMessenger.of(context).showSnackBar(const SnackBar(backgroundColor: Colors.red, content: Text('❌ إجابة خاطئة! فقدت قلباً ❤️')));
                                }
                              },
                              child: Text(opt),
                            ),
                          )),
                    ],
                  ),
                ),
              );
            }
          }

          // ----------------------------------------------------
          // 8. TAB 2: FLASHCARDS (SRS)
          // ----------------------------------------------------
          class FlashcardsTab extends ConsumerStatefulWidget {
            const FlashcardsTab({super.key});

            @override
            ConsumerState<FlashcardsTab> createState() => _FlashcardsTabState();
          }

          class _FlashcardsTabState extends ConsumerState<FlashcardsTab> {
            int _idx = 0;
            bool _flipped = false;

            @override
            Widget build(BuildContext context) {
              final tts = ref.watch(ttsProvider);
              final w = dictionaryData[_idx % dictionaryData.length];

              return Padding(
                padding: const EdgeInsets.all(20),
                child: Column(
                  children: [
                    const Text('🧠 نظام التكرار المتباعد (SRS Flashcards)', style: TextStyle(fontSize: 18, fontWeight: FontWeight.bold)),
                    const SizedBox(height: 16),
                    Expanded(
                      child: GestureDetector(
                        onTap: () => setState(() => _flipped = !_flipped),
                        child: Card(
                          elevation: 4,
                          shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(24)),
                          child: Center(
                            child: Padding(
                              padding: const EdgeInsets.all(24),
                              child: Column(
                                mainAxisSize: MainAxisSize.min,
                                children: [
                                  IconButton(icon: const Icon(Icons.volume_up, size: 44, color: Color(0xFF3B82F6)), onPressed: () => tts.speak(w.word)),
                                  const SizedBox(height: 8),
                                  Text(_flipped ? w.translation : w.word, style: TextStyle(fontSize: 32, fontWeight: FontWeight.bold, color: _flipped ? Colors.green : null)),
                                  const SizedBox(height: 6),
                                  Text(_flipped ? w.exampleTranslation : w.phonetic, style: const TextStyle(fontSize: 16, color: Colors.grey)),
                                  const SizedBox(height: 16),
                                  Text(_flipped ? 'مثال: ${w.exampleSentence}' : 'اضغط لقلب البطاقة ومعرفة المعنى', style: const TextStyle(color: Colors.grey, fontStyle: FontStyle.italic)),
                                ],
                              ),
                            ),
                          ),
                        ),
                      ),
                    ),
                    const SizedBox(height: 16),
                    Row(
                      mainAxisAlignment: MainAxisAlignment.spaceEvenly,
                      children: [
                        ElevatedButton(style: ElevatedButton.styleFrom(backgroundColor: Colors.red.shade400, foregroundColor: Colors.white), onPressed: () => _rate(5), child: const Text('صعبة (Hard)')),
                        ElevatedButton(style: ElevatedButton.styleFrom(backgroundColor: Colors.blue.shade400, foregroundColor: Colors.white), onPressed: () => _rate(10), child: const Text('جيدة (Good)')),
                        ElevatedButton(style: ElevatedButton.styleFrom(backgroundColor: Colors.green.shade500, foregroundColor: Colors.white), onPressed: () => _rate(15), child: const Text('سهلة (Easy)')),
                      ],
                    ),
                    const SizedBox(height: 10),
                  ],
                ),
              );
            }

            void _rate(int xp) {
              ref.read(userProfileProvider.notifier).addXp(xp);
              setState(() {
                _flipped = false;
                _idx++;
              });
            }
          }

